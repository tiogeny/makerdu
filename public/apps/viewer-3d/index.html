<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Makerdu 3D WebGL Viewer</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js & STLLoader CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Space Grotesk', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col selection:bg-cyan-500 selection:text-black overflow-hidden select-none">

    <!-- TOPBAR -->
    <header class="bg-slate-900/90 border-b border-slate-800 px-4 py-3 sticky top-0 z-40 backdrop-blur-md flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-purple-500 to-cyan-500 flex items-center justify-center text-slate-950 font-black text-xs shadow-md shadow-purple-500/20">
                🧊
            </div>
            <div>
                <h1 class="font-black text-sm text-white tracking-tight flex items-center gap-2">
                    <span>VISOR 3D WEBGL AUTÓNOMO</span>
                    <span class="text-[9px] px-2 py-0.5 rounded-full bg-purple-500/20 text-purple-300 font-mono font-bold border border-purple-500/40">Makerdu Micro-App</span>
                </h1>
                <p class="text-[10px] text-slate-400">Inspección de mallas STL, cotas dimensionales y cálculo volumétrico</p>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <label class="px-3.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs font-bold cursor-pointer transition">
                Cargar Archivo .STL
                <input type="file" id="stlFileInput" accept=".stl" class="hidden" />
            </label>

            <button
                id="btnSendToLms"
                class="px-4 py-2 rounded-xl bg-gradient-to-r from-cyan-500 to-amber-500 hover:from-cyan-400 hover:to-amber-400 text-slate-950 font-black text-xs transition flex items-center gap-1.5 shadow-lg shadow-cyan-500/20"
            >
                <span>💾 ENVIAR STL A BITÁCORA</span>
            </button>
        </div>
    </header>

    <!-- 3D VIEWPORT CANVAS -->
    <main class="flex-1 relative w-full h-full">
        <div id="viewport" class="w-full h-full absolute inset-0"></div>

        <!-- HUD FLOTANTE CON MEDIDAS -->
        <div class="absolute bottom-6 left-6 right-6 flex flex-col sm:flex-row items-center justify-between gap-4 pointer-events-none">
            <div class="p-4 rounded-2xl bg-slate-900/90 border border-slate-800 shadow-2xl backdrop-blur-md space-y-2 pointer-events-auto max-w-sm">
                <div class="flex items-center justify-between text-xs font-bold">
                    <span class="text-slate-400 uppercase text-[10px] tracking-wider">Cotas Físicas ($X, Y, Z$):</span>
                    <span id="stlDimensions" class="font-mono text-cyan-300">-- x -- x -- mm</span>
                </div>
                <div class="grid grid-cols-2 gap-2 text-[11px]">
                    <div class="bg-slate-950 p-2 rounded-xl border border-slate-800">
                        <span class="text-slate-500 block text-[9px]">Grosor Mínimo</span>
                        <span id="stlWall" class="font-mono font-bold text-emerald-400">≥ 2.0 mm (OK)</span>
                    </div>
                    <div class="bg-slate-950 p-2 rounded-xl border border-slate-800">
                        <span class="text-slate-500 block text-[9px]">Volumen Sólido</span>
                        <span id="stlVol" class="font-mono font-bold text-amber-400">-- cm³</span>
                    </div>
                </div>
            </div>

            <div class="p-3 rounded-2xl bg-slate-900/90 border border-slate-800 text-xs text-slate-400 pointer-events-auto flex items-center gap-2">
                <span>🎨 Estilo de Vista:</span>
                <button id="btnWireframe" class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 text-[11px] font-bold">
                    Malla (Wireframe)
                </button>
                <button id="btnResetView" class="px-2.5 py-1 rounded-lg bg-cyan-950 text-cyan-300 border border-cyan-800 text-[11px] font-bold">
                    Centrar
                </button>
            </div>
        </div>
    </main>

    <!-- SCRIPTS -->
    <script src="app.js"></script>
</body>
</html>
